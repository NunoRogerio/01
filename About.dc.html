<body>
<x-dc>
<helmet>
<style>
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}img,svg{-webkit-user-drag:none}
body{margin:0;background:#F2F2F7;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',system-ui,sans-serif;color:#000000;-webkit-font-smoothing:antialiased}
p{margin:0}
</style>
</helmet>
<!-- About, in three parts: how it started (the problem, in short), the goal and its flow, where we are and what the expert
     interviews are for; then a simple thank you, the authors as a note (Anastasia first) and the build line from Login.
     Opened from Login (top right) and from the user preferences (last row). Back returns to the screen before. -->
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; padding-top: 52px; background: #F2F2F7; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; color: #000000">
  <!-- Header, fixed: back on the left, the logo (as in the user preferences) centred, an empty column on the right to balance it -->
  <div style="display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; gap: 8px; flex-shrink: 0; padding: 8px 16px 8px">
    <a href="{{backHref}}" data-wf-back="1" class="mbtn" onClick="{{back}}" aria-label="{{tx.back}}" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; background: rgba(118,118,128,0.12); color: #3C3C43; text-decoration: none; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"></path><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"></path></svg></a>
    <span aria-hidden="true" style="display: flex; align-items: center; justify-content: center; justify-self: center; gap: 8px; min-width: 0; transform: scale(1.08); color: #6E6E73; font-size: 17px; font-weight: 600; letter-spacing: 0.02em; line-height: 22px; white-space: nowrap">
      <svg width="18" height="22" viewBox="3.4 5 17.2 20.9" aria-hidden="true" style="flex-shrink: 0; display: block; overflow: visible"><path fill="currentColor" fill-rule="evenodd" d="M12 21.5a6 6 0 0 1-6-6c0-3.6 3-5.4 3.6-9 2.4 1.8 3.6 3.6 3.6 5.4 1.2-1 1.8-2.4 1.8-3.6 1.9 1.9 3 4.3 3 7.2a6 6 0 0 1-6 6ZM8.2 15.8Q12 12 15.8 15.8Q12 19.6 8.2 15.8Z"></path><path d="M12 21.3V24M5.2 25.2Q12 23.3 18.8 23.8" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"></path></svg>Forest Fire Watch
    </span>
    <span aria-hidden="true"></span>
  </div>

  <!-- One column that scrolls freely (no snapping); groups 56px apart, each named by a group label 8px above its content -->
  <div data-wf-page="1" style="display: flex; flex-direction: column; gap: 56px; flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; scrollbar-width: none; padding: 32px 16px 48px">

    <!-- Title M, then part 1, How it started: one short paragraph about the problem, not about the authors -->
    <div style="display: flex; flex-direction: column; gap: 32px; flex-shrink: 0">
      <h1 style="margin: 0; font-size: 26px; font-weight: 600; line-height: 32px; letter-spacing: -0.01em">{{tx.title}}</h1>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span class="wf-label" style="font-size: 15px; font-weight: 600; line-height: 20px; color: #6E6E73">{{tx.start}}</span>
        <p style="font-size: 17px; line-height: 22px">{{tx.intro1}}</p>
      </div>
    </div>

    <!-- Part 2, The goal: the goal in two lines, then the flow (detect, confirm, deploy) with the incident chat across every step -->
    <div style="display: flex; flex-direction: column; gap: 8px; flex-shrink: 0">
      <span class="wf-label" style="font-size: 15px; font-weight: 600; line-height: 20px; color: #6E6E73">{{tx.idea}}</span>
      <div style="display: flex; flex-direction: column; gap: 24px; padding: 16px; border-radius: 16px; background: #FFFFFF">
        <p style="font-size: 17px; line-height: 22px">{{tx.goal}}</p>
        <ol aria-label="{{tx.idea}}" style="display: flex; flex-direction: column; margin: 0; padding: 0; list-style: none">
          <sc-for list="{{steps}}" as="st" hint-placeholder-count="3">
            <li style="display: grid; grid-template-columns: 44px minmax(0, 1fr); column-gap: 16px">
              <span aria-hidden="true" style="display: flex; flex-direction: column; align-items: center">
                <span style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; background: rgba(118,118,128,0.12); color: #3A3A3C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{st.ic}}"></path></svg></span>
                <span style="display: {{st.lineD}}; flex: 1 1 auto; width: 2px; min-height: 16px; margin: 4px 0; border-radius: 999px; background: rgba(60,60,67,0.2)"></span>
              </span>
              <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0; padding: 0 0 {{st.pb}}px">
                <span style="font-size: 17px; font-weight: 600; line-height: 22px">{{st.n}}. {{st.t}}</span>
                <span style="font-size: 15px; line-height: 20px; color: #6E6E73">{{st.d}}</span>
              </span>
            </li>
          </sc-for>
        </ol>
        <!-- Across all three steps: one chat per incident -->
        <div style="display: flex; align-items: center; gap: 16px; padding: 16px; border-radius: 16px; background: rgba(118,118,128,0.12)">
          <span aria-hidden="true" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; background: var(--wf-y); color: #1C1C1E"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5h16v10H9l-5 4Z"></path></svg></span>
          <span style="font-size: 17px; line-height: 22px">{{tx.chat}}</span>
        </div>
        <p style="font-size: 17px; line-height: 22px">{{tx.why}}</p>
      </div>
    </div>

    <!-- Part 3, Where we are: the stages so far (the current one tagged), then what the feedback sessions are for -->
    <div style="display: flex; flex-direction: column; gap: 8px; flex-shrink: 0">
      <span class="wf-label" style="font-size: 15px; font-weight: 600; line-height: 20px; color: #6E6E73">{{tx.stage}}</span>
      <ol aria-label="{{tx.stage}}" style="display: flex; flex-direction: column; margin: 0; padding: 0; list-style: none; border-radius: 16px; background: #FFFFFF; overflow: hidden">
        <sc-for list="{{stages}}" as="sg" hint-placeholder-count="3">
          <li aria-current="{{sg.cur}}" style="display: flex; align-items: center; gap: 16px; min-height: 52px; padding: 12px 16px; box-sizing: border-box; border-top: {{sg.bt}}">
            <span aria-hidden="true" style="display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; flex-shrink: 0; border-radius: 50%; background: {{sg.bg}}; color: {{sg.fg}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.57" stroke-linecap="round" stroke-linejoin="round"><path d="{{sg.ic}}"></path></svg></span>
            <span style="flex-grow: 1; min-width: 0; font-size: 17px; font-weight: {{sg.w}}; line-height: 22px">{{sg.t}}</span>
            <span style="display: {{sg.tagD}}; align-items: center; height: 24px; padding: 0 10px; flex-shrink: 0; border-radius: 999px; background: var(--wf-y); color: #1C1C1E; font-size: 15px; font-weight: 600; line-height: 20px">{{tx.now}}</span>
          </li>
        </sc-for>
      </ol>
      <div style="display: flex; flex-direction: column; gap: 16px; margin-top: 8px; font-size: 17px; line-height: 22px">
        <p>{{tx.stage1}}</p>
        <p>{{tx.stage2}}</p>
      </div>
    </div>

    <!-- A simple thank you, the authors as a note, then the build line as on Login -->
    <span style="flex-shrink: 0; font-size: 17px; font-weight: 700; line-height: 22px; text-align: center">{{tx.thanks}}</span>
    <!-- The authors, as a closing note (Anastasia first), in the annotation style -->
    <p style="flex-shrink: 0; margin-top: -32px; font-size: 17px; line-height: 22px; text-align: center">{{tx.by}}</p>
    <p style="flex-shrink: 0; margin-top: -32px; font-size: 15px; line-height: 20px; color: #6E6E73; text-align: center"><span style="font-weight: 700; color: #3A3A3C">{{tx.alpha}}</span> {{verTxt}}</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    // The date of the app's last design change, as on Login (version.txt)
    try { fetch('version.txt?t=' + Date.now(), { cache: 'no-store' }).then((r) => (r.ok ? r.text() : '')).then((v) => { const n = parseInt(String(v).trim(), 10); if (n > 1e9) this.setState({ ver: n }); }).catch(() => {}); } catch (e) {}
  }
  renderVals() {
    const s = this.state || {}, lang = window.__wfLang === 'pt' ? 'pt' : window.__wfLang === 'ja' ? 'ja' : 'en';
    const L = (en, pt, ja) => (lang === 'pt' ? pt : lang === 'ja' ? ja : en);
    let role = ''; try { role = window.localStorage.getItem('wf-role') || ''; } catch (e) {}
    const M = { en: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], pt: ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'] };
    const d = s.ver ? new Date(s.ver * 1000) : null;
    const verTxt = !d || isNaN(d) ? '' : lang === 'ja' ? '最終更新: ' + d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日'
      : L('Last update: ', 'Última atualização: ', '') + d.getDate() + ' ' + M[lang === 'pt' ? 'pt' : 'en'][d.getMonth()] + ' ' + d.getFullYear();
    const IC = {
      detect: 'M12 3v3M12 18v3M3 12h3M18 12h3M18 12a6 6 0 1 1-12 0 6 6 0 0 1 12 0ZM13.5 12a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Z',
      confirm: 'M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12ZM14.5 12a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0Z',
      deploy: 'M3 16.5V8h10.5v8.5M13.5 11h4l3 3.5v2M3 16.5h1.7M9.3 16.5h4.9M18.8 16.5h1.7M9.3 17a2.3 2.3 0 1 1-4.6 0 2.3 2.3 0 0 1 4.6 0ZM18.8 17a2.3 2.3 0 1 1-4.6 0 2.3 2.3 0 0 1 4.6 0Z'
    };
    const steps = [
      [IC.detect, L('Detect', 'Detetar', '検知'), L('Many sources working together (satellites, cameras, sensors, people\'s reports) catch an ignition as quickly and accurately as possible.', 'Várias fontes a trabalhar em conjunto (satélites, câmaras, sensores, alertas de pessoas) captam uma ignição o mais rápido e com a maior precisão possível.', '衛星、カメラ、センサー、人々からの通報など、複数の情報源が連携し、発火をできるだけ速く正確にとらえます。')],
      [IC.confirm, L('Confirm', 'Confirmar', '確認'), L('Coordinators check it, by drone or with crews on the ground.', 'Os coordenadores verificam, por drone ou com equipas no terreno.', 'コーディネーターがドローンや現場の隊員で確かめます。')],
      [IC.deploy, L('Deploy', 'Enviar meios', '出動'), L('The nearest stations send their crews.', 'Os quartéis mais próximos enviam as equipas.', '最寄りの消防署が隊員を送ります。')]
    ].map(([ic, t, dd], i, a) => ({ ic, t, d: dd, n: i + 1, lineD: i < a.length - 1 ? 'block' : 'none', pb: i < a.length - 1 ? 16 : 0 }));
    const DONE = 'M5 12.5l4.5 4.5L19 7.5', NOW = 'M13.3 12a1.3 1.3 0 1 1-2.6 0 1.3 1.3 0 0 1 2.6 0Z';
    const stages = [
      [L('Research and scenarios', 'Pesquisa e cenários', '調査とシナリオ'), false],
      [L('Alpha version', 'Versão alfa', 'アルファ版'), false],
      [L('Feedback from experts', 'Feedback de especialistas', '専門家からのフィードバック'), true]
    ].map(([t, now], i) => ({ t, cur: now ? 'step' : 'false', w: now ? 600 : 400, tagD: now ? 'inline-flex' : 'none', ic: now ? NOW : DONE,
      bg: now ? 'var(--wf-y)' : '#3A3A3C', fg: now ? '#1C1C1E' : '#FFFFFF', bt: i ? '1px solid rgba(60,60,67,0.12)' : '0' }));
    return {
      verTxt, steps, stages,
      backHref: role ? 'Main.dc.html' : 'Login.dc.html',
      // Opened from the user preferences: back finds them still open
      back: () => { try { if (window.sessionStorage.getItem('wf-about-from') === 'prefs') window.sessionStorage.setItem('wf-prefs-open', '1'); window.sessionStorage.removeItem('wf-about-from'); } catch (e) {} },
      tx: {
        back: L('Back', 'Voltar', '戻る'),
        title: L('About', 'Sobre', 'このアプリについて'),
        start: L('How it started', 'Como começou', 'はじまり'),
        intro1: L('Wildfires grow larger every year, and the toll keeps rising: lives lost, homes and forests burned, from Nevada City, California, to Porto, Portugal. We kept asking ourselves the same question: could we just sit and watch? We decided we couldn\'t. What followed was a year of conversations, scenarios played out on paper and a close study of the tools already in the field. As UX specialists, we then shaped the interface together, exploring the concepts that surfaced in those conversations and turning them into screens and flows that can be tried.',
          'Os incêndios florestais crescem todos os anos, e o preço não para de subir: vidas perdidas, casas e florestas ardidas, de Nevada City, na Califórnia, ao Porto, em Portugal. Fazíamo-nos sempre a mesma pergunta: podemos ficar sentados a assistir? Decidimos que não. Seguiu-se um ano de conversas, cenários ensaiados no papel e um estudo atento das ferramentas que já existem no terreno. Como especialistas em UX, formulámos depois juntos a interface, explorando os conceitos que foram surgindo nessas conversas e transformando-os em ecrãs e fluxos que se podem experimentar.',
          '山火事は年々大きくなり、その被害も増え続けています。カリフォルニアのネバダシティからポルトガルのポルトまで、命が失われ、家や森が焼かれています。私たちは同じ問いを繰り返してきました。ただ座って見ているだけでいいのか。答えは「いいえ」でした。それから1年、対話を重ね、シナリオを紙の上で試し、現場ですでに使われているツールを丁寧に調べてきました。そしてUXの専門家として、対話の中で見えてきたコンセプトを掘り下げながら、実際に試せる画面とフローへと、2人でインターフェースを形にしました。'),
        by: L('Created by Anastasia Osling and Nuno Rogério, design leads.',
          'Criado por Anastasia Osling e Nuno Rogério, design leads.',
          '制作: Anastasia Osling、Nuno Rogério(デザインリード)'),
        idea: L('The goal', 'O objetivo', '目標'),
        goal: L('In a wildfire, the first minutes decide how big it gets. Our goal is to shorten the path from the first sign of an ignition to confirming it and getting firefighters on the way, and to make that path easier for everyone on it.',
          'Num incêndio rural, os primeiros minutos decidem a sua dimensão. O nosso objetivo é encurtar o caminho entre o primeiro sinal de uma ignição, a sua confirmação e o envio dos bombeiros, e tornar esse caminho mais simples para todos os que nele participam.',
          '山火事では、最初の数分がその規模を左右します。私たちの目標は、発火の最初の兆候から確認、消防隊の出動までの道のりを短くし、そこに関わるすべての人にとってわかりやすくすることです。'),
        chat: L('At every step, one chat per incident keeps coordinators, crews and station chiefs on the same page.',
          'Em cada passo, uma conversa por incidente mantém coordenadores, equipas e comandantes de quartel alinhados.',
          'どの段階でも、インシデントごとのチャットでコーディネーター、隊員、署長が同じ情報を共有します。'),
        why: L('Today these steps often live in separate tools and phone calls. We want to see what happens when they work as one system: faster decisions, fewer gaps, and forests and people better protected.',
          'Hoje estes passos vivem muitas vezes em ferramentas separadas e em chamadas telefónicas. Queremos perceber o que acontece quando funcionam como um só sistema: decisões mais rápidas, menos falhas, e florestas e pessoas mais protegidas.',
          '現在、これらの段階は別々のツールや電話に分かれていることが少なくありません。それらがひとつのシステムとして動いたら何が起きるのかを確かめたいのです。より速い判断、より少ない抜け漏れ、そして森と人をよりよく守ることです。'),
        stage: L('Where we are', 'Em que fase estamos', '現在の段階'),
        now: L('Now', 'Agora', '現在'),
        stage1: L('Forest Fire Watch is now an alpha version, shared with a small group of experts. Many tools and technologies already tackle each of these problems. We still wanted to try one integrated system.',
          'O Forest Fire Watch é agora uma versão alfa, partilhada com um grupo restrito de especialistas. Já existem muitas ferramentas e tecnologias para cada uma destas questões. Mesmo assim, quisemos testar um sistema integrado.',
          'Forest Fire Watchは現在アルファ版で、限られた専門家の方々に公開しています。それぞれの課題に取り組むツールや技術はすでに数多くありますが、それでも統合されたシステムを試したいと考えました。'),
        stage2: L('Our goal in these interviews: hear from people with real experience fighting fires or planning prevention and resources. However much we read, only that experience tells us if the app makes sense and what we missed. If we invited you to a feedback session, that is why: we want your view.',
          'O nosso objetivo nestas entrevistas: ouvir quem tem experiência real no combate a incêndios ou no planeamento da prevenção e dos meios. Por muito que tenhamos lido, só essa experiência nos diz se a app faz sentido e o que nos escapou. Se foi convidado para uma sessão de feedback, é por isso: queremos a sua opinião.',
          'このインタビューの目的は、消火活動や予防・資源計画に実際に携わってきた方々の声を聞くことです。どれだけ文献を読んでも、このアプリが意味を持つのか、何を見落としているのかは、その経験なしにはわかりません。フィードバックセッションにお招きしたのはそのためです。ぜひご意見をお聞かせください。'),
        thanks: L('Thank you.', 'Obrigado.', 'ありがとうございます。'),
        alpha: L('Alpha version.', 'Versão alfa.', 'アルファ版。')
      }
    };
  }
}
</script>
</body>
</html>
