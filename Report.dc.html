<style>
body{margin:0;background:#F2F2F7;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',system-ui,sans-serif;color:#000000;-webkit-font-smoothing:antialiased}
a{color:#0079A6}a:hover{color:#006A91}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes ping{0%{transform:scale(1);opacity:.75}100%{transform:scale(2.8);opacity:0}}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(232,106,0,0)}50%{box-shadow:0 0 0 6px rgba(232,106,0,0.1)}}
@keyframes scan{from{transform:translateY(-90px)}to{transform:translateY(290px)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes lock{0%{opacity:0;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
@keyframes shimmer{from{background-position:-200% 0}to{background-position:200% 0}}
.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.fade{animation:fade .9s ease both}
.pop{animation:pop .6s cubic-bezier(.2,.8,.2,1) both}
.lock{animation:lock .5s cubic-bezier(.2,.8,.2,1) both}
.dot{position:relative;display:inline-block;flex-shrink:0;width:8px;height:8px;border-radius:50%;background:currentColor}
.dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:currentColor;animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;box-sizing:border-box;border:1px solid transparent;border-radius:999px;cursor:pointer;text-decoration:none;font:inherit;transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .3s ease,background-color .2s ease,border-color .2s ease,color .2s ease}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0) scale(.97);transition-duration:.08s}
.btn .go{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.btn:hover .go{transform:translateX(4px)}
.btn .spin{transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.btn:hover .spin{transform:rotate(-90deg)}
.primary{background:#E86A00;color:#1A0F00;animation:breathe 2.8s ease-in-out infinite}
.primary:hover{background:#C25700;color:#1A0F00;box-shadow:0 14px 34px -10px rgba(232,106,0,0.75);animation:none}
.ghost{background:rgba(60,60,67,0.05);color:#000000;border-color:rgba(60,60,67,0.088)}
.ghost:hover{background:rgba(60,60,67,0.099);border-color:rgba(60,60,67,0.22);color:#000000}
.round{border-radius:50%}
.chip{transition:background-color .25s ease,border-color .25s ease,color .25s ease,transform .2s cubic-bezier(.2,.8,.2,1)}
.chip:hover{transform:translateY(-1px)}
.chip:active{transform:scale(.96)}
.card{transition:transform .3s cubic-bezier(.2,.8,.2,1),border-color .3s ease,background-color .3s ease,box-shadow .3s ease}
a.card:hover{transform:translateY(-3px);border-color:rgba(232,106,0,0.55);box-shadow:0 18px 40px -18px rgba(232,106,0,0.55)}
.row{transition:background-color .2s ease}
.row:hover{background-color:rgba(60,60,67,0.044)}
.seg{transition:left .38s cubic-bezier(.2,.8,.2,1),width .38s cubic-bezier(.2,.8,.2,1)}
.navi{transition:color .2s ease,background-color .25s ease}
.navi:hover{color:#000000}
.navi svg{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.navi:hover svg{transform:translateY(-2px)}
.mbtn{transition:background-color .2s ease,color .2s ease}
.mbtn:hover{background-color:rgba(60,60,67,0.132)}
.fill{transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) .3s both}
.scan{animation:scan 3.4s linear infinite}
.shimmer{background:linear-gradient(90deg,rgba(60,60,67,0.0) 0%,rgba(60,60,67,0.154) 50%,rgba(60,60,67,0.0) 100%);background-size:200% 100%;animation:shimmer 2.4s linear infinite}
:focus-visible{outline:2px solid #0079A6;outline-offset:3px}
.kpi{font-size:30px;font-weight:300;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.kpi small{font-size:15px;font-weight:500;letter-spacing:0;color:#6C6C70}
.lbl{display:flex;align-items:center;gap:6px;margin:0;font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:none;color:#6C6C70}
.sheet{transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.scrim{transition:opacity .35s ease}
.opt{transition:background-color .2s ease,border-color .25s ease,transform .2s cubic-bezier(.2,.8,.2,1)}
.opt:hover{transform:translateY(-1px);background-color:rgba(60,60,67,0.055)}
.opt[aria-disabled=true]:hover{transform:none;background-color:transparent}
.xfade{transition:opacity .45s ease}
@keyframes jump{0%,58%,100%{transform:translateY(0)}64%{transform:translateY(-7px)}70%{transform:translateY(0)}75%{transform:translateY(-3px)}80%{transform:translateY(0)}}
.jump{animation:jump 2.6s cubic-bezier(.3,.7,.4,1) infinite}
.bar{transform-origin:left center;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes fsin{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.fsin{animation:fsin .35s cubic-bezier(.2,.8,.2,1) both}
.knob{transition:transform .3s cubic-bezier(.2,.8,.2,1),background-color .25s ease}
.track{transition:background-color .25s ease,border-color .25s ease}
.fsbtn{transition:background-color .2s ease,transform .2s cubic-bezier(.2,.8,.2,1)}
.fsbtn:hover{background-color:rgba(0,0,0,0.176);transform:scale(1.06)}
.tipwrap{pointer-events:auto;cursor:help}
a.tipwrap{cursor:pointer}
.tipwrap:hover,.tipwrap:focus-visible{z-index:15}
.tip{position:absolute;left:50%;bottom:calc(100% + 10px);z-index:20;width:210px;box-sizing:border-box;padding:9px 12px;border-radius:14px;background:rgba(255,255,255,0.97);border:1px solid rgba(60,60,67,0.11);box-shadow:0 14px 30px -12px rgba(0,0,0,0.198);font:400 15px/1.45 -apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;letter-spacing:0;text-transform:none;text-align:left;white-space:normal;color:#3C3C43;text-shadow:none;opacity:0;visibility:hidden;pointer-events:none;transform:translate(-50%,4px);transition:opacity .15s ease,transform .15s ease,visibility 0s linear .15s}
.tip b{display:block;margin-bottom:2px;font-weight:600;color:#000000}
.tip.dn{bottom:auto;top:calc(100% + 10px)}
.tip.l{left:-6px;transform:translate(0,4px)}
.tip.r{left:auto;right:-6px;transform:translate(0,4px)}
.tipwrap:hover>.tip,.tipwrap:focus-visible>.tip{opacity:1;visibility:visible;transform:translate(-50%,0);transition:opacity .18s ease .25s,transform .18s ease .25s,visibility 0s linear .25s}
.tipwrap:hover>.tip.l,.tipwrap:hover>.tip.r,.tipwrap:focus-visible>.tip.l,.tipwrap:focus-visible>.tip.r{transform:translate(0,0)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
a.card .go{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
a.card:hover .go{transform:translateX(4px)}
.ring{animation:ringdraw 1.4s cubic-bezier(.2,.8,.2,1) .25s both}
@keyframes ringdraw{from{stroke-dashoffset:214}}
.check{stroke-dasharray:40;animation:checkdraw .7s cubic-bezier(.2,.8,.2,1) .35s both}
@keyframes checkdraw{from{stroke-dashoffset:40}to{stroke-dashoffset:0}}

/* iOS layer */
body{background:#F2F2F7;color:#000}
a{color:#007AFF}a:hover{color:#0062CC}
:focus-visible{outline:2px solid #007AFF;outline-offset:2px}
.btn,.chip,.opt,.card,.navi,.fsbtn,.mbtn{-webkit-tap-highlight-color:transparent}
.btn:hover,.chip:hover,.opt:hover,a.card:hover,.ddopt:hover,.fsbtn:hover,.navi:hover svg{transform:none!important}
.btn:active,.chip:active,.opt:active,.card:active,.navi:active,.fsbtn:active,.mbtn:active{opacity:.5;transform:none!important;transition:opacity .06s}
.btn .go,a.card:hover .go,.btn:hover .go{transform:none!important}
.btn:hover .spin{transform:none}
.primary,.primary.green{background:#0071E3;color:#FFFFFF;animation:none!important;padding:0 20px!important;justify-content:center;gap:8px;box-shadow:none}
.primary:hover,.primary.green:hover{background:#0077ED;color:#FFFFFF;box-shadow:none}
.primary.green{background:#248A3D}.primary.green:hover{background:#1F7F37}
.primary .go{display:none!important}
.primary>span{flex-grow:0!important;text-align:center!important}
.ghost{background:rgba(118,118,128,.12);border-color:transparent;color:#007AFF}
.ghost:hover{background:rgba(118,118,128,.18);border-color:transparent;color:#007AFF}
.ghost.round{color:#000;background:rgba(255,255,255,.85);border-color:rgba(60,60,67,.08);box-shadow:0 2px 10px rgba(0,0,0,.08);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.ghost.round:hover{color:#000}
.opt,.card,.ddopt{border-radius:20px!important}
a.card,.stackbtn{background-color:rgba(255,255,255,.92)!important;border-color:rgba(60,60,67,.08)!important;box-shadow:0 6px 24px rgba(0,0,0,.10)!important}
.opt:hover{background-color:rgba(118,118,128,.08)}
.lbl{font-size:15px;font-weight:400;letter-spacing:0;text-transform:none;color:#6C6C70}
.kpi{font-family:ui-rounded,'SF Pro Rounded',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-weight:600;letter-spacing:-.01em}
.kpi small{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;font-weight:400;color:#6C6C70}
.tip,.ctip,.igpill{background:rgba(255,255,255,.98);border-color:rgba(60,60,67,.1);border-radius:13px;color:#3C3C43;box-shadow:0 10px 30px rgba(0,0,0,.14)}
.igpill::after{background:rgba(255,255,255,.98);border-color:rgba(60,60,67,.1)}
.tip b,.ctip b{color:#000}
.sheet{border-radius:38px 38px 0 0;background:#F2F2F7!important;box-shadow:0 -8px 40px rgba(0,0,0,.12)!important}
.navi{border-radius:999px}
nav[aria-label="Main"]{background:rgba(249,249,249,.86)!important;border-color:rgba(60,60,67,.08)!important;box-shadow:0 8px 30px rgba(0,0,0,.10)!important}
.fsin{color:#FFFFFF}

</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; padding-top: 56px; background: #F2F2F7; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; color: #000000">

  <div class="fade" style="color: #FFFFFF; position: relative; z-index: 1; flex-shrink: 0; width: 390px; height: 342px; margin: -24px 0 0; overflow: hidden; background: #1C1C1E; animation-delay: 140ms">

    </svg>

      <span style="position: absolute; right: 0; top: 0; width: 12px; height: 12px; border-right: 2px solid #FFD60A; border-top: 2px solid #FFD60A"></span>
      <span style="position: absolute; left: 0; bottom: 0; width: 12px; height: 12px; border-left: 2px solid #FFD60A; border-bottom: 2px solid #FFD60A"></span>

    const seg = (m) => ({
      pressed: mode === m ? 'true' : 'false',
      fg: mode === m ? '#FFFFFF' : '#98989F',
      pick: () => this.setState({ mode: m })
    });
    const icons = {
      Smoke: 'M7 18a4 4 0 0 1-.6-8A6 6 0 0 1 18 9.5a4.3 4.3 0 0 1 0 8.5Z',
      Flames: 'M12 20.5a5 5 0 0 1-5-5c0-3 2.5-4.5 3-7.5 2 1.5 3 3 3 4.5 1-.8 1.5-2 1.5-3 1.6 1.6 2.5 3.6 2.5 6a5 5 0 0 1-5 5Z',
      Both: 'M12 3 2 8l10 5 10-5-10-5ZM2 13l10 5 10-5'
    };
    const chips = (list, cur, key) => list.map((label) => ({
      label,
      icon: icons[label] || '',
      pressed: label === cur ? 'true' : 'false',
      bd: label === cur ? 'rgba(0,122,255,0)' : 'rgba(60,60,67,0.0)',
      bg: label === cur ? '#0071E3' : '#FFFFFF',
      fg: label === cur ? '#FFFFFF' : '#F2F2F7',
      pick: () => this.setState({ [key]: label })
    }));

      photo: seg('photo'), video: seg('video'),

      shutterRadius: mode === 'video' ? '10px' : '50%',
      shutterLabel: mode === 'video' ? 'Start recording' : 'Take photo',
      seeOpts: chips(['Smoke', 'Flames', 'Both'], see, 'see'),
      farOpts: chips(['Under 1 km', '1–5 km', 'Further'], far, 'far')
    };
  }
