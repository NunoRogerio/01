name: Portugal fires snapshot
# Copies the Fogos.pt active-incidents feed into data/pt-fires.json so the app can read it
# from its own site (the feed doesn't allow browsers on other sites to read it directly).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/pt-fires.yml']
permissions:
  contents: write
concurrency:
  group: pt-fires
  cancel-in-progress: true   # a stuck run must never block the next ones
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Fetch feed
        run: |
          mkdir -p data
          curl -fsS --retry 3 --retry-all-errors --connect-timeout 10 -m 30 \
            -A "ForestFireWatch/1.0 (+https://github.com/NunoRogerio/01)" \
            https://api.fogos.pt/v2/incidents/active -o /tmp/pt.json
          python3 -c "import json;d=json.load(open('/tmp/pt.json'));assert isinstance(d.get('data'),list);json.dump(d,open('data/pt-fires.json','w'),ensure_ascii=False);print(len(d['data']),'incidents')"
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pt-fires.json
          git diff --cached --quiet || (git commit -m "Update Portugal fires snapshot" && git pull --rebase -q && git push)
