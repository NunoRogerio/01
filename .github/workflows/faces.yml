name: Firefighter portraits
# Candidate portraits for the chat team and demo profiles (Pexels / Unsplash licence). Runs by hand or when the list changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/faces.txt', 'scripts/faces.py', '.github/workflows/faces.yml']
permissions:
  contents: write
concurrency:
  group: faces
  cancel-in-progress: false
jobs:
  faces:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download portraits
        run: python3 scripts/faces.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/faces
          git diff --cached --quiet || (git commit -m "Add firefighter portrait candidates" && git pull --rebase -q && git push)
