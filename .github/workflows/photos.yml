name: Nature photos
# Leaves, flowers and forest lakes for the photo headers and cards (Unsplash licence). Runs by hand or when the
# list changes, and never replaces a photo already saved.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/photos.txt', 'scripts/photos.py', '.github/workflows/photos.yml']
permissions:
  contents: write
concurrency:
  group: photos
  cancel-in-progress: false
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download photos
        run: python3 scripts/photos.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/splash
          git diff --cached --quiet || (git commit -m "Add nature photos" && git pull --rebase -q && git push)
