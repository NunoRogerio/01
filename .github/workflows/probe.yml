name: Probe open data sources
on:
  push:
    branches: [main]
    paths: ['scripts/probe.py', '.github/workflows/probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/probe.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/_probe.txt && git commit -m "Probe open data sources" && git pull --rebase -q && git push
