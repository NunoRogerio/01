name: Open data (CAL FIRE, EFFIS)
# Writes data/calfire.json (CAL FIRE active incidents) and data/pt-burnt.json (EFFIS burnt areas, Portugal, 30 days).
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/extra.yml', 'scripts/extra.py']
permissions:
  contents: write
concurrency:
  group: extra
  cancel-in-progress: true
jobs:
  extra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/extra.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calfire.json data/pt-burnt.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Update CAL FIRE and EFFIS data" && git pull --rebase -q && git push)
