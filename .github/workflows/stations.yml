name: Fire stations
# Weekly snapshot of fire stations from OpenStreetMap for Portugal, the United States and Brazil.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/stations.py', '.github/workflows/stations.yml']
permissions:
  contents: write
concurrency:
  group: stations
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch stations
        run: python3 scripts/stations.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stations-*.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Update fire stations" && git pull --rebase -q && git push)
