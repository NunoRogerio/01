name: Satellite hotspots (NASA FIRMS)
# Writes data/regions.json (countries -> regions, US states -> counties) and data/hotspots.json
# (VIIRS hotspots, last 24 h, Europe + the Americas) for the app's ignition candidates.
# Needs the repository secret FIRMS_MAP_KEY (free key: https://firms.modaps.eosdis.nasa.gov/api/map_key/).
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/firms.yml', 'scripts/firms.py']
permissions:
  contents: write
concurrency:
  group: firms
  cancel-in-progress: true
jobs:
  hotspots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .ne-cache
          key: natural-earth-10m-v1
      - name: Install
        run: pip install --quiet shapely
      - name: Build regions and hotspots
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python3 scripts/firms.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/regions.json data/hotspots.json 2>/dev/null || git add data/regions.json
          git diff --cached --quiet || (git commit -m "Update satellite hotspots" && git pull --rebase -q && git push)
