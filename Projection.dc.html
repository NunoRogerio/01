<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#F2F2F7;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',system-ui,sans-serif;color:#000000;-webkit-font-smoothing:antialiased}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;box-sizing:border-box;border:1px solid transparent;border-radius:999px;cursor:pointer;text-decoration:none;font:inherit;-webkit-tap-highlight-color:transparent}
</style>
</helmet>
<!-- Spread projection: the fire on its map with where it can be in 1, 3 and 6 hours (the fire model from live weather,
     terrain and fuel); opened from the incident chat's fire card. Back returns to the screen before. -->
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; padding-top: 52px; background: #F2F2F7; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; color: #000000">
  <!-- Full screen only: the map as its own layer. On the page the map is a band that scrolls with everything else. -->
  <sc-if value="{{full}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; z-index: 7">
      <dc-import name="TerrainMap" mode="spread" fire-id="{{f.id}}" fire-x="{{f.x}}" fire-y="{{f.y}}" stations-st="{{f.st}}" fire-only="true" loader="true" no-routes="true" horizon="{{hz}}" grow="{{grow}}" fake-hz="{{fakeHz}}" leg-now="{{legNow}}" leg-grow="{{legGrow}}" leg-grow-label="{{legGrowL}}" w="390" h="844" clip-top="{{zero}}" clip-bleed="{{zero}}" clip-bottom="{{zero}}" ctrl-top="{{ctrlTop}}" zoom="{{viewF.zoom}}" focus-x="{{viewF.fx}}" focus-y="{{viewF.fy}}" controls="side" radius="{{zero}}" attr-bottom="{{attrF}}" on-full="{{toggleFull}}" is-full="{{yes}}" close-x="true" hint-size="390px,844px"></dc-import>
          <!-- The horizon switcher on the full-screen map too, in the dark map-control style, on the map buttons' centre line, left of them -->
      <div role="tablist" aria-label="{{tx.hz}}" class="wf-seg" data-wf-hzfull="1" style="position: absolute; left: 16px; right: 68px; bottom: 20px; z-index: 30; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(16px) saturate(180%); -webkit-backdrop-filter: blur(16px) saturate(180%)">
        <span class="segthumb" aria-hidden="true" style="width: calc((100% - 20px) / 4); transform: translateX({{segX}})"><span class="segblob"></span></span>
        <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="4">
          <button type="button" role="tab" class="segopt" aria-selected="{{tb.sel}}" onClick="{{tb.pick}}" style="font-size: 17px; font-weight: {{tb.w}}; color: {{tb.fgD}}">{{tb.label}}</button>
        </sc-for>
      </div>
</div>
  </sc-if>

  <!-- Same header as the fire: the place, the level above, the kind band with the fire's state tag -->
  <div style="position: relative; z-index: 6; flex-shrink: 0; padding: 8px 16px 12px; background: #F2F2F7; box-shadow: 0 0 16px rgba(0,0,0,0.08);">
    <span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: -56px; height: 56px; background: #F2F2F7"></span>
    <!-- Large-title layout (as iOS): back on the top row, the title under it across the full width -->
    <div style="display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: start; column-gap: 8px; row-gap: 8px; min-width: 0">
      <a href="Chat.dc.html" data-wf-back="1" class="mbtn" aria-label="Back" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; flex-shrink: 0; padding: 0; border: 0; border-radius: 50%; background: rgba(118,118,128,0.12); color: #3C3C43; text-decoration: none; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"></path><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"></path></svg></a>
      <!-- The header buttons of every incident screen (chats, notifications, profile), as on the station and fire pages -->
<div style="grid-column: 3; grid-row: 1; display: flex; align-items: flex-start; gap: 8px; flex-shrink: 0"><a href="Chat.dc.html" class="opt" onClick="{{hx.ch.open}}" aria-label="{{hx.ch.aria}}" style="position: relative; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; flex-shrink: 0; margin: 0; padding: 0; border: 0; border-radius: 50%; background: rgba(118,118,128,0.12); color: #3C3C43; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5h16v10H9l-5 4Z"></path></svg><span aria-hidden="true" style="display: {{hx.ch.badgeD}}; position: absolute; top: -13px; right: -10px; min-width: 24px; height: 24px; box-sizing: border-box; padding: 0 7px; border: 2px solid #F2F2F7; border-radius: 999px; background: var(--wf-y); color: #1C1C1E; font-size: 15px; font-weight: 600; line-height: 20px; text-align: center; font-variant-numeric: tabular-nums">{{hx.ch.n}}</span></a><button type="button" class="opt" onClick="{{hx.openNt}}" aria-haspopup="dialog" aria-label="{{hx.ntAria}}" style="position: relative; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; flex-shrink: 0; margin: 0; padding: 0; border: 0; border-radius: 50%; background: rgba(118,118,128,0.12); color: #3C3C43; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15Z"></path><path d="M10 20.5a2 2 0 0 0 4 0"></path></svg><span aria-hidden="true" style="display: {{hx.ntD}}; position: absolute; top: -13px; right: -10px; min-width: 24px; height: 24px; box-sizing: border-box; padding: 0 7px; border: 2px solid #F2F2F7; border-radius: 999px; background: var(--wf-y); color: #1C1C1E; font-size: 15px; font-weight: 600; line-height: 20px; text-align: center; font-variant-numeric: tabular-nums">{{hx.ntN}}</span></button><button type="button" class="opt avbtn" onClick="{{hx.openPf}}" aria-haspopup="dialog" aria-label="Preferences" style="position: relative; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; flex-shrink: 0; margin: 0; padding: 0; border: 0; border-radius: 50%; background: #E5E5EA; color: #000000; font: inherit; font-size: 15px; font-weight: 600; overflow: hidden; cursor: pointer">{{hx.code}}<span aria-hidden="true" style="position: absolute; inset: 0; background-image: {{hx.photoBg}}; background-size: cover; background-position: center"></span></button></div>
      <div style="grid-column: 1 / -1; grid-row: 2; display: flex; flex-direction: column; min-width: 0">
    <h1 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.01em; line-height: 32px; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: break-word">{{f.place}}</h1>
    <span style="display: block; margin-top: 2px; font-size: 17px; line-height: 22px; color: #000000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{f.region}}</span>
      </div>
    </div>
    <!-- In place of the kind band: the horizon switcher -->
    <div style="margin-top: 16px">
    <div role="tablist" aria-label="{{tx.hz}}" class="wf-seg">
      <span class="segthumb" aria-hidden="true" style="width: calc((100% - 20px) / 4); transform: translateX({{segX}})"><span class="segblob"></span></span>
      <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="4">
        <button type="button" role="tab" class="segopt" aria-selected="{{tb.sel}}" onClick="{{tb.pick}}" style="font-size: 17px; font-weight: {{tb.w}}">{{tb.label}}</button>
      </sc-for>
    </div>
    </div>
  </div>

  <!-- Everything under the header scrolls as one page: the horizon (it stays at the top while scrolling), the map band twice
       the old window (the current outline and, at +1/+3/+6 h, the projected shape in lime at 50%), the figures, then the fire -->
  <div class="wf-page" style="position: relative; z-index: 5; display: flex; flex-direction: column; flex-grow: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; overscroll-behavior: contain; padding: 0 0 32px">
    <!-- The map band leaves room for the KPI cards under it, so they show without scrolling -->
    <div style="position: relative; flex-shrink: 0; height: {{bandH}}px; margin-top: 16px; overflow: hidden">
      <dc-import name="TerrainMap" mode="spread" fire-id="{{f.id}}" fire-x="{{f.x}}" fire-y="{{f.y}}" stations-st="{{f.st}}" fire-only="true" loader="true" no-routes="true" no-title="true" leg-now="{{legNow}}" leg-grow="{{legGrow}}" leg-grow-label="{{legGrowL}}" horizon="{{hz}}" grow="{{grow}}" fake-hz="{{fakeHz}}" w="390" h="{{bandH}}" clip-top="{{zero}}" clip-bleed="{{zero}}" clip-bottom="{{zero}}" locked="true" zoom="{{view.zoom}}" focus-x="{{view.fx}}" focus-y="{{view.fy}}" controls="side" radius="{{zero}}" attr-bottom="{{zero}}" on-full="{{toggleFull}}" is-full="{{no}}" hint-size="390px,600px"></dc-import>
    </div>
    <div style="display: flex; flex-direction: column; gap: 24px; padding: 16px 16px 0">
    <div role="list" style="display: flex; gap: 8px">
      <sc-for list="{{kpis}}" as="m" hint-placeholder-count="3">
        <div role="listitem" data-wf-kpicard="1" style="position: relative; display: flex; flex-direction: column; align-items: center; flex: 1 1 0; min-width: 0; box-sizing: border-box; min-height: 110px; padding: 12px 8px 8px; border-radius: 16px; background: #FFFFFF; box-shadow: 0 0 10px rgba(0,0,0,0.08)">
          <span style="display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; flex-shrink: 0; min-height: 40px; max-width: 100%; font-size: 15px; line-height: 20px; color: #6E6E73; text-align: center">{{m.l}}</span>
          <span style="display: flex; align-items: baseline; gap: 3px; white-space: nowrap"><span class="kpi wf-big" style="--k: 30px">{{m.n}}</span><span style="display: {{m.uD}}; font-size: 15px; line-height: 20px; font-weight: 400; color: #6E6E73">{{m.u}}</span></span>
          <span style="display: {{m.subD}}; margin-top: 4px; max-width: 100%; font-size: 13px; line-height: 18px; color: #6E6E73; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{m.sub}}</span>
          <span class="wf-note" aria-hidden="true" style="position: absolute; right: 3px; top: 36px; bottom: 8px; writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; white-space: nowrap; font-size: 13px !important; line-height: 16px !important; opacity: 0.4; pointer-events: none">{{tx.est}}</span>
        </div>
      </sc-for>
    </div>
    <p class="wf-note" style="margin: -4px 4px 0">{{note}}</p>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() { this._sync = () => this.forceUpdate(); try { window.addEventListener('wf-sync', this._sync); } catch (e) {} this._t = setInterval(() => { const v = this.fire(); const M = v && (window.__wfModels || {})[v.id]; if (M && M.done) { clearInterval(this._t); } this.forceUpdate(); }, 1500); }
  componentWillUnmount() { try { window.removeEventListener('wf-sync', this._sync); } catch (e) {} clearInterval(this._t); }
  fire() { let v = null; try { v = JSON.parse(window.sessionStorage.getItem('wf-proj') || 'null'); } catch (e) {} return v || (window.__wfMem || {}).proj || null; }
  renderVals() {
    const s = this.state || {}, PT = window.__wfLang === 'pt', L = (en, pt) => (PT ? pt : en);
    const v = this.fire() || { id: '', place: 'Fire', x: 610, y: 290 };
    const live = Array.isArray(window.__wfLiveFires) ? window.__wfLiveFires : [], r = live.find((q) => String(q[2]) === String(v.id)) || null, I = (r && r[9]) || {};
    const lat = 34.19 - (v.y - 662) / 2829, lon = (v.x - 518) / 2345 - 118.13;
    const M = r && window.__wfLiveMap && window.__wfFireModel ? (window.__wfFireModel({ id: r[2], st: r[0], lat, lon, ha: r[8], res: r[7], note: r[4] }) || null) : null;
    const mdl = M && !M.failed && M.snaps && M.snaps[0] ? M : null;
    const HZ = [0, 1, 3, 6], hz = s.hz != null ? s.hz : 1;
    const snapAt = (h) => { if (!mdl) return null; for (let k = h; k > 0; k--) if (mdl.snaps[k]) return mdl.snaps[k]; return mdl.snaps[0]; };
    const S0 = snapAt(0), Sh = snapAt(hz);
    // The projected shape: the current outline grown about its centre to 1.3× / 1.5× / 2× its area at +1 / +3 / +6 h
    const GROW = { 0: 1, 1: 1.6, 3: 2, 6: 3.6 }, gk = GROW[hz] || 1;
    // Framing: the current outline and its largest projection (2×), in the 390 × 600 band (and full screen)
    const P = (la, lo) => [(lo + 118.13) * 2345 + 518, (34.19 - la) * 2829 + 662];
    const ring0 = S0 && S0.ring && S0.ring.length ? S0.ring.map((p) => P(p[0], p[1])) : null;
    const frame = (W, H) => { if (!ring0) return { zoom: 2.4, fx: v.x - 12, fy: v.y + 8 };
      const cx = ring0.reduce((a, p) => a + p[0], 0) / ring0.length, cy = ring0.reduce((a, p) => a + p[1], 0) / ring0.length, k = 2.4;
      const pts = ring0.map((p) => [cx + (p[0] - cx) * k, cy + (p[1] - cy) * k]), xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]), x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
      return { zoom: Math.max(0.4, Math.min(4, Math.min(W / (x1 - x0 + 120), H / (y1 - y0 + 120)))), fx: (x0 + x1) / 2, fy: (y0 + y1) / 2 }; };
    const view = frame(390, 600), viewF = frame(390, 600);
    const TN = { hot: ['#963B00', 'rgba(184,74,0,0.14)'], warn: ['#963B00', 'rgba(184,74,0,0.14)'], amber: ['#745200', 'rgba(122,86,0,0.14)'], blue: ['#185A93', 'rgba(31,111,178,0.14)'], ok: ['#186B2D', 'rgba(52,199,89,0.14)'], watch: ['#14532D', 'rgba(20,83,45,0.16)'], off: ['#636366', 'rgba(118,118,128,0.14)'] }; let tn = TN[I.tone] || TN.hot; { const T = window.__wfStageTag && (r ? { id: r[2], note: r[4], info: I } : null) ? window.__wfStageTag((r ? { id: r[2], note: r[4], info: I } : null)) : null; if (T) tn = [T.fg, T.bg]; }   /* the shared stage tag colours */;
    const US = r ? /^[A-Z]{2}$/.test(r[0]) && r[0] !== 'PT' : !PT;
    const dec = (n) => String(n).replace('.', PT ? ',' : '.');
    const area = (ha) => (ha == null ? '—' : US ? String(Math.round(ha * 2.471)) : (ha < 10 ? dec(Math.round(ha * 10) / 10) : String(Math.round(ha))));
    const aU = US ? 'acres' : 'ha';
    // Always numbers: the model's area now, else the reported size, else an illustrative 12 ha (all marked Estimate)
    const A0 = S0 && S0.ha > 0 ? S0.ha : (r && Number(r[8]) > 0 ? Number(r[8]) : 12), Ah = A0 * gk;
    // Perimeter of an irregular outline ≈ 1.3 × a circle's of the same area; the burning share from the model, else a typical uncontained spread
    const perKm = (ha) => 1.3 * 2 * Math.sqrt(Math.PI * ha * 10000) / 1000;
    const act = Sh && Sh.active != null ? Number(Sh.active) : ({ 0: 40, 1: 55, 3: 65, 6: 75 })[hz];
    const km = (n) => (US ? dec(Math.round(n * 0.6214 * 10) / 10) + ' mi' : dec(Math.round(n * 10) / 10) + ' km');
    const etr = mdl && mdl.etrAt ? new Date(mdl.etrAt) : null;
    const hhmm = (d) => String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    const kpis = [
      { l: hz ? L('Area in ' + hz + ' h', 'Área em ' + hz + ' h') : L('Area now', 'Área agora'), n: area(Ah), u: aU, sub: hz ? '+' + area(Ah - A0) + ' ' + aU : L('Burned so far', 'Ardido até agora') },
      { l: L('Burning edge', 'Frente ativa'), n: String(Math.round(act)), u: '%', sub: km(perKm(Ah) * act / 100) + L(' long', ' de extensão') },
      { l: L('Held by', 'Dominado às'), n: etr ? hhmm(etr) : '6+', u: etr ? '' : 'h', sub: etr ? L('Model estimate', 'Estimativa do modelo') : L('Not in 6 h', 'Não em 6 h') }
    ].map((k) => ({ ...k, uD: k.u ? 'inline' : 'none', subD: k.sub ? 'block' : 'none' }));
    const F = !!s.full;
    const hx = window.__wfHdrAct ? window.__wfHdrAct() : { code: '', photoBg: 'none', ntN: '', ntD: 'none', ntAria: 'Notifications', openNt: null, openPf: null, ch: { badgeD: 'none', n: '', aria: 'Incident chats', open: null } };
    /* full screen: the switcher sits left of the stacked round controls, level with the lowest (fixed: bottom 20px, right 68px) */
    // the map band: the screen's height minus the header and the KPI row (16px above and below the cards), never under 280px;
    // measured once the screen is laid out, so larger text or a longer title still leaves the KPIs in view
    const bandH = s.bandH || 420;
    clearTimeout(this._bhT); this._bhT = setTimeout(() => { try { const pg = document.querySelector('.wf-page'), kp = pg && pg.querySelector('[data-wf-kpicard]'); if (!pg || !kp) return;
      const k = pg.getBoundingClientRect().height / (pg.offsetHeight || 1) || 1, avail = pg.offsetHeight - 16 - 16 - kp.offsetHeight - 16, h = Math.max(280, Math.round(avail));
      if (Math.abs(h - ((this.state || {}).bandH || 0)) > 2) this.setState({ bandH: h }); } catch (e) {} }, 80);
    // the map legend's values: the burned area now and, from +1 h, the projected one, each as its area and its perimeter
    const legNow = area(A0) + ' ' + aU + '. ' + km(perKm(A0)), legGrow = hz ? area(Ah) + ' ' + aU + '. ' + km(perKm(Ah)) : '', legGrowL = L('In ' + hz + ' h', 'Em ' + hz + ' h');
    return { hx, bandH, legNow, legGrow, legGrowL,
      f: { id: v.id, x: v.x, y: v.y, st: r ? r[0] : '', place: v.place || (r && r[3]) || 'Fire', region: (r && r[1]) || String(v.note || '').split(' · ')[0] || '', tag: I.stEn || I.st || '', tagD: (I.stEn || I.st) ? 'inline-flex' : 'none', tagBg: tn[1], tagFg: tn[0] },
      tx: { kind: L('Projection', 'Projeção'), hz: L('Projection horizon', 'Horizonte da projeção'), est: L('Estimate', 'Estimativa'), fire: L('View fire', 'Ver incêndio') },
      hz, grow: gk, fakeHz: ({ 0: 0, 1: 1, 3: 2, 6: 3 })[hz], zero: 0, yes: true, no: false, full: F, view, viewF, kpis,
      tabs: HZ.map((h) => ({ label: h ? '+' + h + ' h' : L('Now', 'Agora'), sel: String(h === hz), w: h === hz ? 600 : 400, fgD: h === hz ? '#1C1C1E' : '#FFFFFF', pick: () => { try { if (navigator.vibrate) navigator.vibrate(8); } catch (e) {} this.setState({ hz: h }); } })),
      segX: (HZ.indexOf(hz) * 100) + '%',
      note: (hz ? L('In lime: where the fire can be in ' + hz + ' h, ' + Math.round((gk - 1) * 100) + '% more area than now. ', 'A lima: onde o fogo pode estar em ' + hz + ' h, mais ' + Math.round((gk - 1) * 100) + '% de área que agora. ') : '') + (mdl ? L('Fire model from live wind, humidity, slope and fuel, with the crews reported on it. ', 'Modelo de fogo com vento, humidade, declive e combustível em direto e os meios reportados. ') + (mdl.src || '') + '.' : M && M.failed ? L('The fire model could not run (weather or terrain unreachable). The outline is illustrative.', 'O modelo de fogo não correu (tempo ou terreno inacessíveis). O contorno é ilustrativo.') : r ? L('Running the fire model…', 'A correr o modelo de fogo…') : L('Illustrative projection: this fire is not in the live feeds.', 'Projeção ilustrativa: este incêndio não está nos dados em direto.')),
      ctrlTop: 60, attrF: 40,
      toggleFull: () => this.setState({ full: !(this.state || {}).full }),
      goFire: () => { const fv = { id: v.id, place: v.place, note: v.note, x: v.x, y: v.y, t: Date.now() }; window.__wfMem = Object.assign(window.__wfMem || {}, { fireView: fv }); try { window.sessionStorage.setItem('wf-fireview', JSON.stringify(fv)); } catch (e) {} }
    };
  }
}
</script>
</body>
</html>
